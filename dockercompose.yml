version: '3.8'

services:
  api:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: almoxarifado
      MYSQL_ROOT_PASSWORD: "mysql_root"
    ports:
      - "3306:3306"
    volumes:
      - ./banco-de-dados.sql:/docker-entrypoint-initdb.d/banco.sql