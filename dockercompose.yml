services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PASSWORD: mysql_root
    depends_on:
      - db
    volumes:
      - ./static:/app/static

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: almoxarifado
      MYSQL_ROOT_PASSWORD: "mysql_root"
    ports:
      - "3306:3306"
    volumes:
      - ./banco-de-dados.sql:/docker-entrypoint-initdb.d/banco.sql